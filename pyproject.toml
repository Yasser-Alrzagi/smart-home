[project]
name = "smart-student-housing"
version = "1.0.0"
description = "Student housing backend — foundation stage, not a complete product"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.28,<1",
  "sqlalchemy>=2.0.28,<2.1",
  "pymysql>=1.1,<2",
  "cryptography>=42.0.5",
  "alembic>=1.13.1,<2",
  "pydantic>=2.6.4,<3",
  "pydantic-settings>=2.2.1,<3",
  "PyJWT>=2.10.1,<3",
  "argon2-cffi>=25.1,<26",
  "bcrypt>=5,<6",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1.6,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.1.1,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
