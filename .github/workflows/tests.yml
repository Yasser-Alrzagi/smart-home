name: Foundation and identity checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    services:
      mariadb:
        image: mariadb:11.8.6
        env:
          # Disposable CI credentials only; never use these in a real deployment.
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: smart_home_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://foundation:ci-only@127.0.0.1:3306/smart_home_test?charset=utf8mb4
      TEST_MIGRATION_DATABASE_URL: mysql+pymysql://foundation:ci-only@127.0.0.1:3306/smart_home_test_migration?charset=utf8mb4
      RUN_MIGRATION_CYCLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify lock and generated requirements
        run: |
          python -m pip install uv==0.12.10
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt > /dev/null
          uv export --frozen --no-emit-project --format requirements-txt --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements.txt requirements-dev.txt uv.lock
      - name: Prepare isolated database permissions and collation
        run: |
          python - <<'PY'
          import pymysql
          with pymysql.connect(host='127.0.0.1', user='root', password='ci-root-only', autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute('ALTER DATABASE smart_home_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci')
                  cur.execute('CREATE DATABASE smart_home_test_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci')
                  cur.execute("CREATE USER 'foundation'@'%' IDENTIFIED BY 'ci-only'")
                  for name in ['smart_home_test', 'smart_home_test_migration']:
                      cur.execute(f"GRANT ALL PRIVILEGES ON `{name}`.* TO 'foundation'@'%'")
          PY
      - name: Upgrade guarded test database
        run: python -m tools.test_database
      - name: Static checks
        run: ruff check .
      - name: Full suite including real migration cycle
        run: python -m pytest -q --cov=app --cov=main --cov-branch --cov-report=term-missing --junitxml=test-results.xml
      - name: Install browser for UI verification
        if: matrix.python-version == '3.13'
        run: python -m playwright install --with-deps chromium
      - name: Real Arabic UI workflow
        if: matrix.python-version == '3.13'
        run: python -m tools.ui_smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            artifacts/ui/
